<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Бургерная</title>
   <link rel="stylesheet" href="./style.css">
   <link rel="icon" href="./images/VF.svg" type="image/svg+xml">
</head>
<body>
   <header class="site__header">
      <div class="container header__container">
         <a href="#" class="header__logo-link">
            <img src="./images/VF.svg" alt="Vintage Food Logo" class="header__logo-icon">
            <span class="header__title">Vintage Food</span>
         </a>
         <nav class="navigation">
            <ul class="menu__list">
               <li><a href="#home" class="menu__link">Главная</a></li>
               <li><a href="#stock" class="menu__link">Акции</a></li>
               <li><a href="#about" class="menu__link">О нас</a></li>
            </ul>
         </nav>
         <button class="basket">
            <img src="./icons/basket.svg" alt="Корзина" class="basket__icon">
         </button>
      </div>
   </header>

   <section class="hero" id="home">
      <div class="container hero__container">
         <div class="hero__content">
            <h1 class="hero__title">Быстрая доставка для Вас</h1>
            <p class="hero__subtitle">Сделай первый заказ и получи скидку 50%</p>
            <button class="hero__button">Заказать</button>
         </div>
         
         <div class="hero__image-wrapper">
            <img src="./images/burger.png" alt="Бургер" class="hero__image">
         </div>
      </div>
   </section>

   <section class="menu__section">
      <div class="container">
         <h2 class="section__title">Меню</h2>

         <div class="menu__grid">
            <a href="#" class="menu__card">
               <img src="./images/burgers.svg" alt="Бургеры" class="menu__img">
               <h3 class="menu__name">Бургеры</h3>
            </a>
            <a href="#" class="menu__card">
               <img src="./images/chikens.svg" alt="Блюда из курицы" class="menu__img">
               <h3 class="menu__name">Блюда из курицы</h3>
            </a>
            <a href="#" class="menu__card">
               <img src="./images/hots.svg" alt="Горячие блюда" class="menu__img">
               <h3 class="menu__name">Горячие блюда</h3>
            </a>
            <a href="#" class="menu__card">
               <img src="./images/snack.svg" alt="Закуски" class="menu__img">
               <h3 class="menu__name">Закуски</h3>
            </a>
            <a href="#" class="menu__card">
               <img src="./images/salads.svg" alt="Салаты" class="menu__img">
               <h3 class="menu__name">Салаты</h3>
            </a>
            <a href="#" class="menu__card">
               <img src="./images/deserts.svg" alt="Десерты" class="menu__img">
               <h3 class="menu__name">Десерты</h3>
            </a>
         </div>
      </div>
   </section>

   <footer class="site__footer">
      <div class="container footer__container">
         <div class="footer__links">
            <a href="#" class="footer__link">Программа лояльности</a>
            <a href="#" class="footer__link">Политика конфиденциальности</a>
            <a href="#" class="footer__link">Договор оферты</a>
         </div>

         <div class="footer__info">
            <p class="footer__company">ООО «Vintage Food»</p>
            <p class="footer__copyright">© Все права защищены</p>
         </div>

         <div class="footer__socials">
            <a href="#" class="social__link">
               <img src="./icons/VK.svg" alt="VK" class="social__icon">
            </a>
            <a href="#" class="social__link">
               <img src="./icons/Telegram.svg" alt="Telegram" class="social__icon">
            </a>
         </div>
      </div>
   </footer>
</body>
</html>
